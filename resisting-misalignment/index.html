<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Draft · password required</title>
<style>
  :root { --navy: #0A1630; --ink: #172033; --muted: #606B7D; --paper: #FBF8F1; --coral: #F45D43; --hairline: #D9D2C6;
          --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
          --sans: "Avenir Next", Avenir, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); display: flex; align-items: center; justify-content: center; padding: 16px; }
  form { width: 100%; max-width: 380px; background: #fff; border: 1px solid var(--hairline); border-radius: 14px; padding: 30px 28px 26px; box-shadow: 0 10px 30px rgba(10, 22, 48, .07); }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 1.45rem; color: var(--navy); margin: 0 0 6px; }
  p { margin: 0 0 20px; color: var(--muted); font-size: .95rem; line-height: 1.45; }
  label { display: block; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  input { width: 100%; font: inherit; font-size: 1.1rem; letter-spacing: .12em; padding: 11px 12px; border: 1.5px solid var(--hairline); border-radius: 9px; background: var(--paper); color: var(--navy); }
  input:focus { outline: none; border-color: var(--navy); }
  button { margin-top: 14px; width: 100%; font: inherit; font-weight: 600; padding: 11px 12px; border: 0; border-radius: 9px; background: var(--navy); color: #fff; cursor: pointer; }
  button[disabled] { opacity: .6; cursor: progress; }
  #msg { min-height: 1.3em; margin: 12px 0 0; font-size: .9rem; color: var(--coral); }
</style>
</head>
<body>
<form id="gate" autocomplete="off">
  <h1>Private draft</h1>
  <p>This page is shared by invitation. Enter the password you were given to read it.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autofocus autocapitalize="characters" spellcheck="false">
  <button id="go" type="submit">Open</button>
  <div id="msg" role="alert"></div>
</form>
<noscript><p style="position:fixed;bottom:16px;left:16px;right:16px;text-align:center">This page needs JavaScript.</p></noscript>
<script>
(function () {
  var ITER = 600000, KEY = 'rm-draft-pass';
  var form = document.getElementById('gate'), pw = document.getElementById('pw'),
      go = document.getElementById('go'), msg = document.getElementById('msg'), payload = null;

  function load() {
    if (!payload) payload = fetch('payload.bin', { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error('fetch'); return r.arrayBuffer(); });
    return payload;
  }

  async function unlock(pass) {
    var buf = new Uint8Array(await load()), salt = buf.slice(0, 16), ct = buf.slice(16);
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
    var bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: salt, iterations: ITER }, base, 384));
    var key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
    var gz = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-CBC', iv: bits.slice(32) }, key, ct));   // throws on a wrong password
    if (gz[0] !== 0x1f || gz[1] !== 0x8b) throw new Error('bad');
    var stream = new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(stream).text();
  }

  async function attempt(pass, quiet) {
    go.disabled = true; msg.textContent = quiet ? '' : 'Unlocking…'; msg.style.color = 'var(--muted)';
    try {
      var html = await unlock(pass);
      try { sessionStorage.setItem(KEY, pass); } catch (e) {}
      document.open(); document.write(html); document.close();
    } catch (e) {
      try { sessionStorage.removeItem(KEY); } catch (e2) {}
      go.disabled = false; msg.style.color = 'var(--coral)';
      msg.textContent = quiet ? '' : (e && e.message === 'fetch' ? 'Could not load the page. Please try again.' :
        (window.crypto && crypto.subtle && window.DecompressionStream ? 'That password did not work.' : 'Please open this page in an up-to-date browser.'));
      pw.select();
    }
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var pass = pw.value.trim().toUpperCase();
    if (pass) attempt(pass, false);
  });

  load().catch(function () {});
  var saved = null; try { saved = sessionStorage.getItem(KEY); } catch (e) {}
  if (saved) attempt(saved, true);                      // so that a refresh does not ask again
})();
</script>
</body>
</html>
